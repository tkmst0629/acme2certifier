# Example acme2certifier configuration for an MPIC remote agent.
#
# An agent only needs the [MpicAgent] section plus whatever the standard
# challenge validators require in its own network location. It does NOT need a
# CA handler, database, or the ACME endpoints.
#
# Point the agent at this file with ACME_SRV_CONFIGFILE=/path/to/agent.cfg

[DEFAULT]
debug: False

[MpicAgent]
# Shared secret the coordinator presents as "Authorization: Bearer <token>".
# Prefer the MPIC_AGENT_TOKEN environment variable over storing it here.
token: change-me-to-a-long-random-secret

# Validate from this agent's own resolver (recommended: True). When True the
# agent ignores any resolver/proxy pinned in the forwarded request so that each
# perspective genuinely queries from its own vantage point.
use_local_resolver: True

# Require the fronting reverse proxy to have verified the coordinator client
# certificate and to pass X-SSL-Client-Verify: SUCCESS. Enable in production.
require_client_cert_header: True
