# Example nginx front end for an MPIC remote agent.
#
# nginx terminates mutual TLS: it verifies the coordinator's client certificate
# against the coordinator CA and forwards the verification result to the agent
# as X-SSL-Client-Verify (checked when require_client_cert_header is enabled).
# The agent itself listens only on localhost.

server {
    listen 8443 ssl;
    server_name mpic-agent.example;

    # Server certificate presented to the coordinator
    ssl_certificate     /etc/nginx/mpic/agent.crt;
    ssl_certificate_key /etc/nginx/mpic/agent.key;

    # Mutual TLS: verify the coordinator's client certificate
    ssl_client_certificate /etc/nginx/mpic/coordinator-ca.pem;
    ssl_verify_client on;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /mpic/validate {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-SSL-Client-Verify $ssl_client_verify;
        proxy_set_header X-SSL-Client-DN $ssl_client_s_dn;
    }
}
